<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta (POS) | Admin Voko</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__header">
        <div class="admin-sidebar__logo">
          <div class="admin-sidebar__logo-icon">V</div>
          <div><div class="admin-sidebar__logo-text">Voko Accesorios</div><div class="admin-sidebar__logo-subtitle">Admin Panel</div></div>
        </div>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="/admin/dashboard.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="/admin/pos.html" class="admin-nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Punto de Venta</a>
        <a href="/admin/inventario.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg> Inventario</a>
        <a href="/admin/pedidos.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Pedidos</a>
        <a href="/admin/calculadora.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg> Calculadora</a>
      </nav>
      <div class="admin-sidebar__footer">
        <button class="admin-logout-btn" onclick="sessionStorage.removeItem('voko_admin'); location.href='/admin/'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-topbar__hamburger" id="sidebar-toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="admin-topbar__title">Punto de Venta (POS)</h1>
      </header>

      <div class="admin-content">
        <div class="pos-layout">
          <!-- Sale Register -->
          <div class="pos-card">
            <h3 class="pos-card__title">Registrar Venta Presencial</h3>

            <div class="pos-add-row">
              <select class="input-field" id="pos-product-select">
                <option value="">Seleccionar producto...</option>
              </select>
              <input type="number" class="input-field input-field--qty" id="pos-qty" value="1" min="1" placeholder="Cant.">
              <button class="btn btn--primary" id="pos-add-btn">Agregar</button>
            </div>

            <!-- Items Table -->
            <div class="admin-table-wrapper" style="margin-bottom: var(--space-6);">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Cant.</th>
                    <th>Precio U.</th>
                    <th>Subtotal</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="pos-items-tbody">
                  <!-- Rendered by JS -->
                </tbody>
              </table>
            </div>

            <!-- Totals & Actions -->
            <div style="max-width: 320px; margin-left: auto;">
              <div class="pos-total-row">
                <span>Subtotal:</span>
                <span id="pos-subtotal">$0</span>
              </div>
              <div class="pos-total-row pos-total-row--grand">
                <span>Total:</span>
                <span id="pos-total">$0</span>
              </div>
              <button class="btn btn--success btn--full btn--lg mt-6" id="pos-confirm-btn" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                Cobrar y Descontar Stock
              </button>
            </div>
          </div>

          <!-- Sales History -->
          <div class="pos-card">
            <h3 class="pos-card__title">Ventas del Día</h3>
            <div id="pos-history-list">
              <div class="admin-empty-state" style="padding: var(--space-8) 0;">
                <p class="admin-empty-state__text">Aún no registraste ventas hoy.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin/pos.js"></script>
</body>
</html>
