<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios | Admin Voko</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar__header">
        <a href="/admin/dashboard.html" class="admin-sidebar__logo" title="Ir al Dashboard">
          <img src="/images/voko_logo.svg" alt="Voko Accesorios" class="admin-sidebar__logo-svg">
        </a>
      </div>
      <nav class="admin-sidebar__nav">
        <a href="/admin/dashboard.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="/admin/pos.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Punto de Venta</a>
        <a href="/admin/inventario.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg> Inventario</a>
        <a href="/admin/pedidos.html" class="admin-nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> Pedidos</a>
        <a href="/admin/calculadora.html" class="admin-nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/></svg> Calculadora</a>
      </nav>
      <div class="admin-sidebar__footer">
        <button class="admin-logout-btn" onclick="sessionStorage.removeItem('voko_admin'); location.href='/admin/'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-topbar__hamburger" id="sidebar-toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="admin-topbar__title">Calculadora de Precios Sugeridos</h1>
      </header>

      <div class="admin-content">
        <div class="calc-layout">
          <!-- Form -->
          <div class="admin-form-card">
            <h3 class="admin-form-card__title">Costos del Producto</h3>
            <form id="calc-form">
              <div class="input-group" style="margin-bottom: var(--space-4);">
                <label class="input-label" for="calc-name">Nombre del accesorio</label>
                <input type="text" class="input-field" id="calc-name" placeholder="Ej: Morral de Cuerina Premium" required>
              </div>

              <div class="admin-form-row">
                <div class="input-group">
                  <label class="input-label" for="calc-materials">Costo de Materiales ($)</label>
                  <input type="number" class="input-field" id="calc-materials" placeholder="15000" min="0" required>
                </div>
                <div class="input-group">
                  <label class="input-label" for="calc-hours">Horas de Trabajo</label>
                  <input type="number" class="input-field" id="calc-hours" placeholder="3" step="0.5" min="0" required>
                </div>
              </div>

              <div class="admin-form-row">
                <div class="input-group">
                  <label class="input-label" for="calc-hourly-rate">Costo por Hora ($)</label>
                  <input type="number" class="input-field" id="calc-hourly-rate" value="5000" min="0" required>
                </div>
                <div class="input-group">
                  <label class="input-label" for="calc-margin">Margen de Ganancia (%)</label>
                  <select class="input-field" id="calc-margin">
                    <option value="40">40% (Recomendado Estándar)</option>
                    <option value="50" selected>50% (Edición Limitada)</option>
                    <option value="60">60% (Alta Gama)</option>
                  </select>
                </div>
              </div>

              <div class="input-group">
                <label class="input-label" for="calc-extras">Gastos Indirectos / Fletes ($)</label>
                <input type="number" class="input-field" id="calc-extras" value="2000" min="0">
              </div>
            </form>
          </div>

          <!-- Calculated Result -->
          <div class="calc-result-card">
            <div class="calc-result-card__label">Precio Sugerido de Venta</div>
            <div class="calc-result-card__price" id="res-price">$0</div>

            <div class="calc-result-card__breakdown">
              <div class="calc-result-card__row">
                <span>Costo Total Materiales:</span>
                <strong id="res-mat">$0</strong>
              </div>
              <div class="calc-result-card__row">
                <span>Mano de Obra:</span>
                <strong id="res-labor">$0</strong>
              </div>
              <div class="calc-result-card__row">
                <span>Costo Base Total:</span>
                <strong id="res-base">$0</strong>
              </div>
              <div class="calc-result-card__row" style="padding-top: var(--space-2); border-top: 1px dashed rgba(255,255,255,0.3);">
                <span>Ganancia Neta:</span>
                <strong id="res-profit" style="color:#a7f3d0;">$0</strong>
              </div>
            </div>

            <button class="btn btn--primary btn--full btn--lg mt-6" id="btn-save-to-inventory" style="background-color: var(--color-surface); color: var(--color-on-surface);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Guardar como Producto en Inventario
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/admin/calculator.js"></script>
</body>
</html>
