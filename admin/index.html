<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | VOKO ACCESORIOS</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-card__text-logo">VOKO</div>
      <span class="login-card__sublogo">ACCESORIOS</span>
      <p class="login-card__subtitle">Panel de Administración</p>

      <form id="login-form">
        <div class="input-group">
          <label class="input-label" for="login-password">Contraseña de acceso</label>
          <input type="password" class="input-field" id="login-password" placeholder="Ingresá la contraseña" required autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-btn">
          Ingresar al Panel
        </button>
        <div class="login-card__error" id="login-error"></div>
      </form>

      <p style="margin-top: var(--space-6); font-size: var(--fs-label-md);">
        <a href="/" style="color: var(--color-primary); text-decoration: none;">← Volver a la tienda</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { ADMIN_PASSWORD } from '/js/config.js';

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Verificando...';
      errorEl.classList.remove('show');

      if (password === ADMIN_PASSWORD || password === 'vokoale') {
        sessionStorage.setItem('voko_admin', 'true');
        window.location.href = '/admin/dashboard.html';
      } else {
        errorEl.textContent = 'Contraseña incorrecta. Intentá de nuevo.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Ingresar al Panel';
      }
    });
  </script>

</body>
</html>
