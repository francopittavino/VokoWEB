<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | VOKO ACCESORIOS</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-card__logo">V</div>
      <h1 class="login-card__title">Voko Accesorios</h1>
      <p class="login-card__subtitle">Panel de Administración</p>

      <form id="login-form">
        <div class="input-group">
          <label class="input-label" for="login-email">Email</label>
          <input type="email" class="input-field" id="login-email" placeholder="admin@vokoaccesorios.com" required>
        </div>
        <div class="input-group">
          <label class="input-label" for="login-password">Contraseña</label>
          <input type="password" class="input-field" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-btn">
          Iniciar Sesión
        </button>
        <div class="login-card__error" id="login-error"></div>
      </form>

      <p style="margin-top: var(--space-6); font-size: var(--fs-label-md); color: var(--color-on-surface-variant);">
        Para acceder, usá las credenciales proporcionadas.<br>
        <a href="/" style="color: var(--color-primary);">← Volver a la tienda</a>
      </p>
    </div>
  </div>

  <script type="module">
    // Simple login - redirect to dashboard
    // In production, this would use Supabase Auth
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      errorEl.classList.remove('show');

      try {
        // Try Supabase auth first
        const { signIn } = await import('/js/supabase.js');
        await signIn(email, password);
        sessionStorage.setItem('voko_admin', 'true');
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        // Fallback: simple local auth for demo
        if (email && password) {
          sessionStorage.setItem('voko_admin', 'true');
          sessionStorage.setItem('voko_admin_email', email);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorEl.textContent = 'Credenciales incorrectas. Intentá de nuevo.';
          errorEl.classList.add('show');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>

</body>
</html>
